name: Build and publish firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firmware-release
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IDF_TOOLS_PATH: ${{ github.workspace }}/.build/esp-tools
      IDF_COMPONENT_CACHE_PATH: ${{ github.workspace }}/.build/component-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test status indicators
        run: |
          mkdir -p .build
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware/flipper-radio/main ci/test-indicator.c firmware/flipper-radio/main/indicator_pattern.c -o .build/test-indicator
          .build/test-indicator
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware/flipper-radio/main -I flipper/common ci/test-wifi-profiles.c firmware/flipper-radio/main/wifi_profiles.c flipper/common/ls_networks.c flipper/common/ls_actions.c -o .build/test-wifi-profiles
          .build/test-wifi-profiles
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware/flipper-radio/main ci/test-wifi-callbacks.c firmware/flipper-radio/main/wifi_callbacks.c -o .build/test-wifi-callbacks
          .build/test-wifi-callbacks
          python ci/test-build-assets.py
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: fff9895c82d744c7237be8847347bdd1b07c6643
          path: .build/esp-idf
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            .build/esp-tools
            .build/component-cache
          key: esp32s2-idf-fff9895c82d744c7237be8847347bdd1b07c6643-python312
      - name: Install toolchain
        run: .build/esp-idf/install.sh esp32s2
      - name: Build and package
        shell: bash
        env:
          LS_HOST_PROFILES_GZIP_B64: ${{ secrets.LS_HOST_PROFILES_GZIP_B64 }}
        run: |
          set -euo pipefail
          source .build/esp-idf/export.sh
          tag="fw-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          python ci/prepare-zstd.py
          python ci/prepare-host-profile.py --output .build/profiles/ls_host_profiles.h
          idf.py -C firmware/flipper-radio -B "$GITHUB_WORKSPACE/.build/radio" -D LINK_STUDIO_BUILD_ID="$tag" -D LINK_STUDIO_GPIO=ON -D LINK_STUDIO_ZSTD="$GITHUB_WORKSPACE/.build/zstd-1.5.7" -D LINK_STUDIO_PROFILES_DIR="$GITHUB_WORKSPACE/.build/profiles" build
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I firmware/flipper-radio/main -I firmware/flipper-radio/managed_components/espressif__cjson/cJSON ci/test-update-contract.c firmware/flipper-radio/main/update_contract.c firmware/flipper-radio/managed_components/espressif__cjson/cJSON/cJSON.c -lm -o .build/test-update-contract
          .build/test-update-contract
          python ci/package.py --build .build/radio --output .build/release --version "$tag" --source-commit "$GITHUB_SHA" --standalone
          cp firmware/flipper-radio/managed_components/espressif__cjson/cJSON/LICENSE .build/release/cJSON-LICENSE.txt
          cp .build/zstd-1.5.7/LICENSE .build/release/Zstandard-LICENSE.txt
          cp LICENSE .build/release/LICENSE.txt
          cp THIRD_PARTY.md .build/release/THIRD_PARTY.md
          cat > .build/release-notes.md <<'EOF'
          ESP32-S2 firmware for the official Flipper Wi-Fi Developer Board.

          Includes desktop/browser USB CDC, iPhone USB MIDI, the standalone GPIO trading runtime, application-slot updates, software recovery, nearby Wi-Fi scanning, up to eight saved networks on the board, home Wi-Fi updates initiated by the Flipper and action-specific RGB status patterns. Link Studio apps fetch firmware.bundle.json from this release and verify its image sizes, target, layout and SHA-256 checksums before writing.

          Built and tested in CI from the tagged source with pinned ESP-IDF and checksum-verified Zstandard. Bounded game-specific connection identities are compiled into the runtime; no console root-key file is needed. This exact CI image has not been marked as physically verified. Consult the source documentation for hardware verification status and limitations.

          Full installation uses bootloader 0x1000, partition table 0x8000, OTA metadata 0xd000 and application 0x10000. Application updates use only pokeldn_radio.bin in the inactive OTA slot. See the repository README for setup, LED states and recovery.
          EOF
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" .build/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Link Studio Radio $RELEASE_TAG" --notes-file .build/release-notes.md --draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
